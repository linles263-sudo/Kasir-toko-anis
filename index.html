       .item-info .nama { font-weight: bold; }
       .item-info .stok { background: #e8f5e9; color: #4CAF50; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 5px; }
       .item-info .barcode { color: #757575; font-size: 13px; }
       .item-aksi .harga { color: #d32f2f; font-weight: bold; font-size: 18px; text-align: right; }
       .btn-tambah { background: #333; color: white; border: none; padding: 8px 20px; border-radius: 5px; margin-top: 5px; font-weight: bold; cursor: pointer; }
       .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); }
       .subtotal { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
       .btn-bayar { background: #d32f2f; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
       .btn-add-produk { background: #4CAF50; color: white; position: fixed; bottom: 130px; right: 20px; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; border: none; box-shadow: 0 3px 6px rgba(0,0,0,0.3); cursor: pointer; }
       .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
       .modal-content { background: white; margin: 15% auto; padding: 20px; width: 90%; border-radius: 10px; max-height: 75vh; overflow-y: auto; }
       .modal input,.modal select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
       .kosong { text-align: center; padding: 40px 20px; color: #757575; }
       .laporan-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; }

       .checkbox-cetak { display:flex;align-items:center;gap:10px;margin:15px 0;font-size:16px; }
       .checkbox-cetak input { width:20px;height:20px; }
       .keranjang-item { background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
       .qty-control { display: flex; align-items: center; gap: 8px; }
       .qty-btn { background: #333; color: white; border: none; width: 28px; height: 28px; border-radius: 5px; font-weight: bold; cursor: pointer; }
       .btn-hapus-item { background: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>
<script>
const LISENSI = {
  namaToko: "TOKO ANIS",
  kodeLisensi: "KSR-2026-AN01",
  expired: "2029-05-03",
  hpAdmin: "62895351432524"
};
const hariIni = new Date().toISOString().slice(0,10);
if(hariIni > LISENSI.expired){
  document.addEventListener('DOMContentLoaded', function() {
    document.body.innerHTML = '';
    document.body.innerHTML = `<div style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#ffffff; z-index:999; display:flex; align-items:center; justify-content:center; text-align:center; font-family:sans-serif; padding:20px; box-sizing:border-box;">
      <div><div style="font-size:60px;">🔒</div><h1 style="color:#dc2626; margin:10px 0; font-size:28px;">LISENSI HABIS</h1><p style="font-size:18px;">Aplikasi <b>${LISENSI.namaToko}</b> sudah expired<br>pada <b>${LISENSI.expired}</b></p><p>Silakan hubungi Admin untuk perpanjangan lisensi:</p><a href="https://wa.me/${LISENSI.hpAdmin}?text=Halo%20Admin,%20saya%20mau%20perpanjang%20lisensi%20${LISENSI.kodeLisensi}%20untuk%20${LISENSI.namaToko}" style="background:#25D366; color:white; padding:15px 25px; border-radius:8px; text-decoration:none; display:inline-block; margin-top:15px; font-weight:bold;">Chat WA Admin Sekarang</a><p style="margin-top:40px; font-size:12px; color:#666;">Kode Lisensi: ${LISENSI.kodeLisensi}</p></div></div>`;
  });
}
</script>

<div class="header">
    <div class="title">
        <h1>KASIR DIGITAL ANIS</h1>
        <h2 id="namaToko">TOKO ANIS</h2>
    </div>
    <div class="kasir-info">
        Kasir: <span id="namaKasir">-</span>
        <div class="cart-icon" onclick="bukaKeranjang()">🛒<div class="cart-count" id="jumlahItem">0</div></div>
    </div>
</div>

<div class="scan-area">
    <h3>SCAN BARANG</h3>
    <p id="statusScan">Siap scan...</p>
    <div id="reader"></div>
    <div class="scan-buttons">
        <button class="scan-btn" onclick="resetKeranjang()">🔄 RESET</button>
        <button class="scan-btn" onclick="mulaiScan()">📷 SCAN</button>
        <button class="scan-btn" onclick="logout()">🚪 LOGOUT</button>
    </div>
</div>

<div class="scan-cepat">
<input type="number" id="inputQty" placeholder="Qty" value="1" min="1">
<input type="text" id="inputScanCepat" placeholder="Klik sini lalu tembak barcode..." onkeypress="if(event.key==='Enter') scanCepat()">
</div>

<div class="produk-header">
    <h3>Daftar Produk</h3>
    <div class="tombol-aksi">
        <button class="btn-header btn-setting" onclick="bukaSetting()">⚙️ PENGATURAN</button>
        <button class="btn-header btn-hapus-data" onclick="hapusSemuaProduk()">🗑️ HAPUS</button>
        <button class="btn-header btn-laporan" onclick="bukaLaporan()">📊 LAPORAN</button>
    </div>
</div>

<div class="kategori" id="listKategori">
    <button class="kategori-btn aktif" onclick="filterKategori('Semua', this)">Semua</button>
    <button class="kategori-btn" onclick="filterKategori('Rokok', this)">Rokok</button>
    <button class="kategori-btn" onclick="filterKategori('Minuman', this)">Minuman</button>
    <button class="kategori-btn" onclick="filterKategori('Mie', this)">Mie</button>
    <button class="kategori-btn" onclick="filterKategori('Snack', this)">Snack</button>
    <button class="kategori-btn" onclick="filterKategori('Lainnya', this)">Lainnya</button>
</div>

<div class="list-produk" id="listProduk"></div>

<div class="footer">
    <div class="subtotal">
        <span>SUBTOTAL:</span>
        <span>Rp<span id="totalHarga">0</span></span>
    </div>
    <button class="btn-bayar" onclick="bukaBayar()">💰 PILIH METODE BAYAR</button>
</div>

<button class="btn-add-produk" onclick="bukaModalTambah()">+</button>

<div id="modalKeranjang" class="modal">
    <div class="modal-content">
        <h3>Keranjang Belanja</h3>
        <div id="isiKeranjang"></div>
        <button class="btn-bayar" style="background:#ccc;color:#333;margin-top:15px" onclick="document.getElementById('modalKeranjang').style.display='none'">TUTUP</button>
    </div>
</div>

<div id="modalLogin" class="modal" style="display:block">
    <div class="modal-content">
        <h3>Login Kasir</h3>
        <input type="text" id="inputNamaKasir" placeholder="Nama Kasir">
        <button class="btn-bayar" style="margin-top:10px" onclick="loginKasir()">MASUK</button>
    </div>
</div>

<div id="modalSetting" class="modal">
    <div class="modal-content">
        <h3>Pengaturan Toko</h3>
        <label>Nama Toko:</label>
        <input type="text" id="inputNamaToko" placeholder="Contoh: TOKO BUDI">
        <button class="btn-bayar" style="background:#4CAF50;margin-top:10px" onclick="simpanSetting()">SIMPAN</button>
        <button class="btn-bayar" style="background:#ccc;color:#333;margin-top:10px" onclick="tutupSetting()">BATAL</button>
    </div>
</div>

<div id="modalTambah" class="modal">
    <div class="modal-content">
        <h3>Tambah Produk Baru</h3>
        <input type="text" id="namaBarang" placeholder="Nama Barang">
        <input type="number" id="hargaBarang" placeholder="Harga Jual">
        <input type="number" id="stokBarang" placeholder="Stok Awal">
        <input type="text" id="barcodeBarang" placeholder="Barcode">
        <select id="kategoriBarang">
            <option value="Lainnya">Lainnya</option>
            <option value="Rokok">Rokok</option>
            <option value="Minuman">Minuman</option>
            <option value="Mie">Mie</option>
            <option value="Snack">Snack</option>
        </select>
        <button class="btn-bayar" style="background:#4CAF50;margin-top:10px" onclick="simpanProduk()">SIMPAN PRODUK</button>
        <button class="btn-bayar" style="background:#ccc;color:#333;margin-top:10px" onclick="tutupModalTambah()">BATAL</button>
    </div>
</div>

<div id="modalEdit" class="modal">
    <div class="modal-content">
        <h3>Edit Produk</h3>
        <input type="hidden" id="editId">
        <input type="text" id="editNama" placeholder="Nama Barang">
        <input type="number" id="editHarga" placeholder="Harga Jual">
        <input type="number" id="editStok" placeholder="Stok">
        <input type="text" id="editBarcode" placeholder="Barcode">
        <select id="editKategori">
            <option value="Lainnya">Lainnya</option>
            <option value="Rokok">Rokok</option>
            <option value="Minuman">Minuman</option>
            <option value="Mie">Mie</option>
            <option value="Snack">Snack</option>
        </select>
        <button class="btn-bayar" style="background:#FF9800;margin-top:10px" onclick="simpanEditProduk()">SIMPAN PERUBAHAN</button>
        <button class="btn-bayar" style="background:#d32f2f;margin-top:10px" onclick="hapusProduk()">HAPUS PRODUK</button>
        <button class="btn-bayar" style="background:#ccc;color:#333;margin-top:10px" onclick="tutupEditProduk()">BATAL</button>
    </div>
</div>

<div id="modalBayar" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center">Total: Rp <span id="totalBayar">0</span></h3>
        <button class="btn-metode btn-cash" onclick="pilihCash()">💵 CASH</button>
        <button class="btn-metode btn-debit" onclick="pilihDebit()">💳 DEBIT</button>
        <button class="btn-metode btn-qr" onclick="pilihQR()">📱 QRIS</button>
        <button class="btn-bayar" style="background:#ccc;color:#333;margin-top:15px" onclick="tutupModalBayar()">TUTUP</button>
    </div>
</div>

<div id="modalCash" class="modal">
    <div class="modal-content">
        <h3>Pembayaran Tunai</h3>
        <p>Total: Rp <span id="totalCash">0</span></p>
        <input type="number" id="uangDiterima" placeholder="Uang Diterima" oninput="hitungKembalian()">
        <div class="kembalian">Kembalian: Rp <span id="kembalian">0</span></div>
        <label class="checkbox-cetak">
            <input type="checkbox" id="cetakStruk" checked>
            <span>Cetak Struk & Buka Laci</span>
        </label>
        <button class="btn-bayar" style="background:#4CAF50" onclick="selesaiBayar('Cash')">SELESAI</button>
        <button class="btn-bayar" style="background:#ccc;color:#333;margin-top:10px" onclick="tutupModalCash()">BATAL</button>
    </div>
</div>

<div id="modalLaporan" class="modal">
    <div class="modal-content">
        <h3>Laporan Penjualan</h3>
        <div id="isiLaporan"></div>
        <h4 style="margin-top:15px">Total Pemasukan: Rp <span id="totalOmzet">0</span></h4>
        <button class="btn-bayar" style="background:#d32f2f;margin-top:15px" onclick="hapusLaporan()">HAPUS LAPORAN</button>
        <button class="btn-bayar" style="background:#ccc;color:#333;margin-top:10px" onclick="tutupLaporan()">TUTUP</button>
    </div>
    </div>
    <script>
let produk = JSON.parse(localStorage.getItem('daftarProduk')) || [];
let keranjang = [];
let laporan = JSON.parse(localStorage.getItem('laporanJual')) || [];
let kategoriAktif = 'Semua';
let namaKasir = localStorage.getItem('namaKasir') || '';
let namaToko = localStorage.getItem('namaToko') || 'TOKO ANIS';
let html5QrCode;

function playBeep() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'square';
        oscillator.frequency.value = 800;
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1);
    } catch(e) { console.log('Beep error:', e); }
}

document.getElementById('namaToko').innerText = namaToko;
if (namaKasir) {
    document.getElementById('namaKasir').innerText = namaKasir;
    document.getElementById('modalLogin').style.display = 'none';
    renderProduk();
} else {
    document.getElementById('modalLogin').style.display = 'block';
}

function scanCepat() {
    const barcode = document.getElementById('inputScanCepat').value.trim();
    const qty = parseInt(document.getElementById('inputQty').value) || 1;
    document.getElementById('inputScanCepat').value = '';
    document.getElementById('inputQty').value = '1';
    if (!barcode) return;
    playBeep();
    const item = produk.find(p => p.barcode == barcode);
    if(item) tambahKeranjang(item.id, qty);
    else alert('Barang tidak ditemukan! Tambah dulu via tombol +');
}

function bukaSetting() {
    document.getElementById('inputNamaToko').value = namaToko;
    document.getElementById('modalSetting').style.display = 'block';
}
function tutupSetting() { document.getElementById('modalSetting').style.display = 'none'; }
function simpanSetting() {
    const namaBaru = document.getElementById('inputNamaToko').value;
    if(!namaBaru) return alert('Nama toko ga boleh kosong!');
    namaToko = namaBaru;
    localStorage.setItem('namaToko', namaToko);
    document.getElementById('namaToko').innerText = namaToko;
    tutupSetting();
    alert('Nama toko berhasil diubah!');
}

function loginKasir() {
    const nama = document.getElementById('inputNamaKasir').value;
    if (!nama) return alert('Isi nama dulu!');
    namaKasir = nama;
    localStorage.setItem('namaKasir', nama);
    document.getElementById('namaKasir').innerText = nama;
    document.getElementById('modalLogin').style.display = 'none';
    renderProduk();
}

function logout() {
    if (confirm('Yakin mau logout?')) {
        localStorage.removeItem('namaKasir');
        keranjang = [];
        updateKeranjang();
        document.getElementById('modalLogin').style.display = 'block';
        document.getElementById('inputNamaKasir').value = '';
    }
}

function hapusSemuaProduk() {
    if(confirm('Yakin hapus SEMUA produk? Data ga bisa balik!')) {
        localStorage.removeItem('daftarProduk');
        produk = [];
        renderProduk();
        alert('Semua produk udah dihapus. Silakan tambah baru via tombol +');
    }
}

function renderProduk() {
    const list = document.getElementById('listProduk');
    list.innerHTML = '';
    let produkFilter = kategoriAktif === 'Semua'? produk : produk.filter(p => p.kategori === kategoriAktif);
    if(produkFilter.length === 0) {
        list.innerHTML = '<div class="kosong">Belum ada produk.<br>Pencet tombol + untuk tambah barang.</div>';
        return;
    }
    produkFilter.forEach(item => {
        list.innerHTML += `
        <div class="item-produk">
            <div class="item-info">
                <div><span class="nama">${item.nama}</span><span class="stok">Stok: ${item.stok}</span></div>
                <div class="barcode">${item.barcode}</div>
            </div>
            <div class="item-aksi">
                <div class="harga">Rp${item.harga.toLocaleString('id-ID')}</div>
                <div style="display:flex; gap:5px; margin-top:5px;">
                  <button class="btn-tambah" style="background:#333; flex:1;" onclick="tambahKeranjang(${item.id})">TAMBAH</button>
                  <button class="btn-tambah" style="background:#FF9800;" onclick="bukaEditProduk(${item.id})">EDIT</button>
                </div>
            </div>
        </div>`;
    });
}

function filterKategori(kat, el) {
    kategoriAktif = kat;
    document.querySelectorAll('.kategori-btn').forEach(btn => btn.classList.remove('aktif'));
    el.classList.add('aktif');
    renderProduk();
}

function bukaModalTambah() { document.getElementById('modalTambah').style.display = 'block'; }
function tutupModalTambah() { document.getElementById('modalTambah').style.display = 'none'; }

function simpanProduk() {
    const nama = document.getElementById('namaBarang').value;
    const harga = parseInt(document.getElementById('hargaBarang').value);
    const stok = parseInt(document.getElementById('stokBarang').value);
    const barcode = document.getElementById('barcodeBarang').value;
    const kategori = document.getElementById('kategoriBarang').value;
    if (!nama ||!harga ||!stok ||!barcode) return alert('Lengkapi semua!');
    if (produk.find(p => p.barcode == barcode)) return alert('Barcode sudah ada!');
    produk.push({ id: Date.now(), barcode, nama, harga, stok, kategori });
    localStorage.setItem('daftarProduk', JSON.stringify(produk));
    tutupModalTambah();
    renderProduk();
    document.getElementById('namaBarang').value = '';
    document.getElementById('hargaBarang').value = '';
    document.getElementById('stokBarang').value = '';
    document.getElementById('barcodeBarang').value = '';
}

function bukaEditProduk(id) {
    const p = produk.find(x => x.id === id);
    if(!p) return;
    document.getElementById('editId').value = p.id;
    document.getElementById('editNama').value = p.nama;
    document.getElementById('editHarga').value = p.harga;
    document.getElementById('editStok').value = p.stok;
    document.getElementById('editBarcode').value = p.barcode;
    document.getElementById('editKategori').value = p.kategori;
    document.getElementById('modalEdit').style.display = 'block';
}

function tutupEditProduk() {
    document.getElementById('modalEdit').style.display = 'none';
}

function simpanEditProduk() {
    const id = parseInt(document.getElementById('editId').value);
    const idx = produk.findIndex(x => x.id === id);
    if(idx === -1) return alert('Produk tidak ditemukan');
    produk[idx].nama = document.getElementById('editNama').value;
    produk[idx].harga = parseInt(document.getElementById('editHarga').value);
    produk[idx].stok = parseInt(document.getElementById('editStok').value);
    produk[idx].barcode = document.getElementById('editBarcode').value;
    produk[idx].kategori = document.getElementById('editKategori').value;
    localStorage.setItem('daftarProduk', JSON.stringify(produk));
    tutupEditProduk();
    renderProduk();
    alert('Produk berhasil diupdate!');
}

function hapusProduk() {
    if(!confirm('Yakin hapus produk ini?')) return;
    const id = parseInt(document.getElementById('editId').value);
    produk = produk.filter(x => x.id!== id);
    localStorage.setItem('daftarProduk', JSON.stringify(produk));
    tutupEditProduk();
    renderProduk();
    alert('Produk dihapus!');
}

function mulaiScan() {
    document.getElementById('reader').style.display = 'block';
    document.getElementById('statusScan').innerText = 'Arahkan ke barcode...';
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess);
}

function onScanSuccess(decodedText) {
    html5QrCode.stop();
    document.getElementById('reader').style.display = 'none';
    document.getElementById('statusScan').innerText = 'Siap scan...';
    playBeep();
    const item = produk.find(p => p.barcode == decodedText);
    const qty = parseInt(document.getElementById('inputQty').value) || 1;
    if(item) tambahKeranjang(item.id, qty);
    else alert('Barang tidak ditemukan! Tambah dulu via tombol +');
    document.getElementById('inputQty').value = '1';
}

function tambahKeranjang(id, qty = 1) {
    const barang = produk.find(p => p.id === id);
    if (!barang) return;
    if (barang.stok < qty) return alert('Stok tidak cukup!');
    const diKeranjang = keranjang.find(k => k.idProduk === id);
    if (diKeranjang) {
        diKeranjang.qty += qty;
    } else {
        keranjang.push({ idItem: Date.now() + Math.random(), idProduk: id, nama: barang.nama, harga: barang.harga, qty: qty });
    }
    localStorage.setItem('keranjangTemp', JSON.stringify(keranjang));
    updateKeranjang();
}

function updateKeranjang() {
    const totalEl = document.getElementById('totalHarga');
    const jumlahEl = document.getElementById('jumlahItem');
    let total = 0, jumlah = 0;
    keranjang.forEach(item => {
        total += item.harga * item.qty;
        jumlah += item.qty;
    });
    totalEl.innerText = total.toLocaleString('id-ID');
    jumlahEl.innerText = jumlah;
    document.getElementById('totalBayar').innerText = total.toLocaleString('id-ID');
    document.getElementById('totalCash').innerText = total.toLocaleString('id-ID');
}

function bukaKeranjang() {
    const div = document.getElementById('isiKeranjang');
    div.innerHTML = '';
    if(keranjang.length === 0) {
        div.innerHTML = '<p>Keranjang kosong</p>';
    } else {
        keranjang.forEach(item => {
            div.innerHTML += `<div class="keranjang-item"><div><b>${item.nama}</b><br>Rp${item.harga.toLocaleString('id-ID')} x ${item.qty}</div><div class="qty-control"><button class="qty-btn" onclick="ubahQty('${item.idItem}', -1)">-</button><span>${item.qty}</span><button class="qty-btn" onclick="ubahQty('${item.idItem}', 1)">+</button><button class="btn-hapus-item" onclick="hapusItem('${item.idItem}')">X</button></div></div>`;
        });
    }
    document.getElementById('modalKeranjang').style.display = 'block';
}

function ubahQty(idItem, tambah) {
    const item = keranjang.find(k => k.idItem == idItem);
    if(!item) return;
    item.qty += tambah;
    if(item.qty <= 0) {
        hapusItem(idItem);
    } else {
        localStorage.setItem('keranjangTemp', JSON.stringify(keranjang));
        updateKeranjang();
        bukaKeranjang();
    }
}

function hapusItem(idItem) {
    if(confirm('Hapus item ini dari keranjang?')) {
        keranjang = keranjang.filter(k => k.idItem!= idItem);
        localStorage.setItem('keranjangTemp', JSON.stringify(keranjang));
        updateKeranjang();
        bukaKeranjang();
    }
}

function resetKeranjang() {
    if (confirm('Kosongkan keranjang?')) {
        keranjang = [];
        updateKeranjang();
    }
}

function bukaBayar() {
    if(keranjang.length === 0) return alert('Keranjang kosong!');
    document.getElementById('modalBayar').style.display = 'block';
}
function tutupModalBayar() { document.getElementById('modalBayar').style.display = 'none'; }

function pilihCash() {
    tutupModalBayar();
    document.getElementById('modalCash').style.display = 'block';
    document.getElementById('uangDiterima').value = '';
    document.getElementById('kembalian').innerText = '0';
    document.getElementById('cetakStruk').checked = true;
}
function tutupModalCash() { document.getElementById('modalCash').style.display = 'none'; }

function hitungKembalian() {
    const total = keranjang.reduce((s,i)=>s+i.harga*i.qty,0);
    const bayar = parseInt(document.getElementById('uangDiterima').value) || 0;
    const kembali = bayar - total;
    document.getElementById('kembalian').innerText = kembali > 0? kembali.toLocaleString('id-ID') : '0';
}

function pilihDebit() { tutupModalBayar(); selesaiBayar('Debit'); }
function pilihQR() { tutupModalBayar(); selesaiBayar('QRIS'); }

function cetakDanBukaLaci(total, metode, transaksi, mauCetak) {
    if (!mauCetak) return;
    let struk = `${namaToko}\n================\nKasir: ${namaKasir}\nWaktu: ${transaksi.waktu}\nMetode: ${metode}\n================\n`;
    transaksi.items.forEach(item => {
        struk += `${item.nama}\n${item.qty} x ${item.harga.toLocaleString('id-ID')} = Rp${(item.harga*item.qty).toLocaleString('id-ID')}\n`;
    });
    struk += `================\nTOTAL: Rp ${total.toLocaleString('id-ID')}\n`;
    if(metode === 'Cash') {
        const bayar = parseInt(document.getElementById('uangDiterima').value) || 0;
        const kembali = bayar - total;
        struk += `TUNAI: Rp ${bayar.toLocaleString('id-ID')}\nKEMBALI: Rp ${kembali > 0? kembali.toLocaleString('id-ID') : '0'}\n`;
    }
    struk += `================\nTerima kasih!\n\n`;
    const bukaLaci = '\x1B\x70\x00\x19\xFA';
    const dataPrint = encodeURIComponent(struk + bukaLaci);
    window.location.href = `rawbt://print?text=${dataPrint}`;
}

function selesaiBayar(metode) {
    const total = keranjang.reduce((s,i)=>s+i.harga*i.qty,0);
    const transaksi = {
        waktu: new Date().toLocaleString('id-ID'),
        kasir: namaKasir,
        total: total,
        metode: metode,
        items: [...keranjang]
    };

    let mauCetak = true;
    if(metode === 'Cash') {
        mauCetak = document.getElementById('cetakStruk').checked;
    }

    cetakDanBukaLaci(total, metode, transaksi, mauCetak);

    let daftarItem = keranjang.map(item => {
        return `${item.nama} ${item.qty}x @${item.harga.toLocaleString('id-ID')}`;
    }).join(" | ");

    transaksi.items = daftarItem;
    laporan.push(transaksi);
    localStorage.setItem('laporanJual', JSON.stringify(laporan));

    keranjang.forEach(item => {
        const prod = produk.find(p => p.id === item.idProduk);
        if (prod) prod.stok -= item.qty;
    });
    localStorage.setItem('daftarProduk', JSON.stringify(produk));

    let pesanBerhasil = `Transaksi ${metode} BERHASIL!\nTotal: Rp ${total.toLocaleString('id-ID')}`;
    if (!mauCetak) pesanBerhasil += '\n\nStruk tidak dicetak.';

    alert(pesanBerhasil);
    keranjang = [];
    updateKeranjang();
    renderProduk();
    tutupModalCash();
    tutupModalBayar();
}

function bukaLaporan() {
    const div = document.getElementById('isiLaporan');
    const totalOmzet = document.getElementById('totalOmzet');
    div.innerHTML = '';
    let omzet = 0;
    if(laporan.length === 0) {
        div.innerHTML = '<p>Belum ada transaksi</p>';
    } else {
        laporan.forEach((trx, i) => {
            omzet += trx.total;
            div.innerHTML += `<div class="laporan-item">
                <b>#${i+1} - ${trx.waktu}</b><br>
                Kasir: ${trx.kasir} | ${trx.metode}<br>
                Items: ${trx.items || '-'} <br>
                Total: Rp ${trx.total.toLocaleString('id-ID')}
            </div>`;
        });
    }
    totalOmzet.innerText = omzet.toLocaleString('id-ID');
    document.getElementById('modalLaporan').style.display = 'block';
}
function tutupLaporan() { document.getElementById('modalLaporan').style.display = 'none'; }
function hapusLaporan() {
    if(confirm('Hapus semua laporan?')) {
        localStorage.removeItem('laporanJual');
        laporan = [];
        bukaLaporan();
    }
}
</script>
